services:
  - type: web
    name: cdjcs-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: cdjcs
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CPF
        value: "13480937497"
      - key: CORS_ORIGINS
        value: "*"
