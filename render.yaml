services:
  - type: web
    name: cdjcs-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: cdjcs
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CPF
        value: "13480937497"
      - key: CORS_ORIGINS
        value: "*"
      # Credencial Digital — biometria (WebAuthn). Ajuste para o domínio real
      # do frontend publicado (ex: "seusite.netlify.app"), sem "https://".
      # Sem isso, a biometria não funciona, mas o resto do app funciona normalmente.
      - key: WEBAUTHN_RP_ID
        value: "localhost"
      - key: WEBAUTHN_ORIGIN
        value: "https://localhost"
